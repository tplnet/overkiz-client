name: Publish to npm
# Triggered by pushing a version tag, e.g. `npm version patch && git push --follow-tags`.
#
# The package is only STAGED on npm (trusted publishing with the stage-only permission).
# It becomes public after a maintainer approves it with 2FA / passkey:
#   npmjs.com > package > Staged Packages, or `npm stage approve <stage-id>`.
# A compromised workflow or repository therefore cannot publish on its own.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm (npm stage publish needs npm >= 11.15.0)
        run: npm install -g npm@latest && npm --version
      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Check release notes in CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > /dev/null
      - run: npm ci
      - name: CVE check (runtime dependencies)
        run: npm audit --omit=dev --audit-level=low
      - run: npm run lint
      - run: npm run build
      - name: Stage the package on npm
        shell: bash   # -eo pipefail: fail the step if npm fails despite tee
        run: |
          TAG_ARGS=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            # pre-releases (e.g. v1.4.0-beta.1) must not become the default version in the Homebridge UI
            TAG_ARGS="--tag next"
          fi
          npm stage publish $TAG_ARGS 2>&1 | tee stage.log
          STAGE_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' stage.log | tail -1 || true)
          {
            echo "### ${GITHUB_REF_NAME} staged on npm – approval required"
            echo ""
            echo "Approve with your passkey on npmjs.com (package > Staged Packages) or run:"
            echo ""
            echo "    npm stage approve ${STAGE_ID:-<stage-id from npm stage list>}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FLAGS=""
          if [[ "$VERSION" == *-* ]]; then FLAGS="--prerelease"; fi
          node scripts/release-notes.mjs "$VERSION" --checks > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$VERSION" --notes-file release-notes.md --generate-notes $FLAGS
