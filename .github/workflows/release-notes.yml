name: Release notes
# Writes the description of a GitHub release from the matching section of CHANGELOG.md
# (new releases get it automatically from publish.yml). Use it to fill or correct existing releases:
# Actions > Release notes > Run workflow, tag e.g. v1.2.3 - or "all" for every release of this repository.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.2.3) or "all"
        required: true
        default: all

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Update release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$TAG" = "all" ]; then
            tags=$(gh release list --limit 200 --json tagName --jq '.[].tagName')
          else
            tags="$TAG"
          fi
          for tag in $tags; do
            if node scripts/release-notes.mjs "${tag#v}" "$tag" > notes.md; then
              if gh release view "$tag" > /dev/null 2>&1; then
                gh release edit "$tag" --notes-file notes.md
              else
                gh release create "$tag" --title "${tag#v}" --notes-file notes.md --verify-tag
              fi
              echo "Updated $tag"
            else
              echo "::warning::No CHANGELOG.md section for $tag - release left unchanged"
            fi
          done
