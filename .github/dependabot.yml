# Weekly pull requests for dependency and GitHub Actions updates (security updates as soon as available).
# Minor and patch updates of dev tools come grouped in one pull request; major updates come one by one,
# so a breaking major update cannot block the others. Merge a pull request when all checks are green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is not supported by typescript-eslint 8 yet (peer typescript <6.1) - remove when it is
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node.js types follow the oldest supported Node.js version, not the newest
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
